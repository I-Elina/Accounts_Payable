services:
  - type: web
    name: cache-me-if-you-can-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MODE
        value: mock
      - key: DB_PATH
        value: /tmp/app.db
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.0"